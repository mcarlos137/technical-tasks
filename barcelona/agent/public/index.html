<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pick-up Games Agent</title>
<style>
  :root { --bg:#0b0b0b; --panel:#161616; --line:#2a2a2a; --text:#f2f2f2; --muted:#9a9a9a; --accent:#f5c518; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; }
  header small { color:var(--muted); }
  header button { margin-left:auto; }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; line-height:1.45; white-space:pre-wrap; max-width:85%; }
  .user { align-self:flex-end; background:var(--accent); color:#111; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  details { font-size:12px; color:var(--muted); margin-top:8px; }
  details pre { white-space:pre-wrap; word-break:break-word; background:#0f0f0f; padding:8px; border-radius:8px; max-height:240px; overflow:auto; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 18px 10px; max-width:820px; width:100%; margin:0 auto; }
  .chips button { font-size:12px; }
  form { display:flex; gap:8px; padding:12px 18px 18px; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:15px; }
  button { padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; }
  form button { background:var(--accent); color:#111; border:none; font-weight:600; border-radius:10px; }
  .thinking { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<header>
  <h1>Pick-up Games Agent</h1>
  <small>Barcelona · data "today" = Tue 25 Aug 2026</small>
  <button id="reset" type="button">New chat</button>
</header>
<div id="log"></div>
<div class="chips" id="chips"></div>
<form id="form">
  <input id="input" placeholder="Ask about pick-up games…" autocomplete="off" autofocus />
  <button type="submit">Send</button>
</form>
<script>
  const examples = [
    'What games are there tomorrow morning?',
    'Anything this weekend?',
    'What about on Thursday?',
    'Any spots at La Catalana?',
    'Are there games at Camp Nou?',
    'Which game has the best players?',
  ];
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  let sessionId = null;

  function add(role, text, toolCalls) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = text;
    if (toolCalls && toolCalls.length) {
      const d = document.createElement('details');
      const s = document.createElement('summary');
      s.textContent = toolCalls.length + ' tool call' + (toolCalls.length > 1 ? 's' : '') + ': ' + toolCalls.map(t => t.name).join(', ');
      const pre = document.createElement('pre');
      pre.textContent = toolCalls.map(t => t.name + '(' + JSON.stringify(t.args) + ')\n→ ' + JSON.stringify(t.result, null, 2)).join('\n\n');
      d.append(s, pre);
      el.append(d);
    }
    log.append(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function ask(message) {
    add('user', message);
    const pending = add('bot thinking', 'Checking the games…');
    try {
      const res = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sessionId, message }) });
      const data = await res.json();
      pending.remove();
      if (!res.ok) throw new Error(data.error || res.statusText);
      sessionId = data.sessionId;
      add('bot', data.reply, data.toolCalls);
    } catch (e) {
      pending.remove();
      add('bot', 'Error: ' + e.message);
    }
  }

  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const m = input.value.trim();
    if (!m) return;
    input.value = '';
    ask(m);
  });
  document.getElementById('reset').addEventListener('click', async () => {
    if (sessionId) await fetch('/api/reset', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sessionId }) });
    sessionId = null;
    log.innerHTML = '';
  });
  const chips = document.getElementById('chips');
  for (const q of examples) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = q;
    b.onclick = () => ask(q);
    chips.append(b);
  }
</script>
</body>
</html>
